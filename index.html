<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國立臺北大學三峽校區學生議會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D2230;--muted:#5A6070;--line:#D9D3C4;--paper:#F7F4EC;--accent:#1F4E9A}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 80px}
header{padding:56px 0 32px;border-bottom:3px double var(--ink);display:flex;flex-direction:column;gap:16px}
.school{font-size:15px;font-weight:500;letter-spacing:.12em;color:var(--muted)}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.topbtns{display:flex;flex-wrap:wrap;gap:10px}
.secbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);font-size:16px;font-weight:500;cursor:pointer}
.secbtn:hover{background:var(--ink);color:var(--paper)}
.form{max-width:420px;padding:32px 0;display:flex;flex-direction:column;gap:8px}
.form label{font-size:15px;font-weight:700;margin-top:8px}
.form input{min-height:52px;padding:0 16px;font-size:18px;font-family:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:4px}
.primary{min-height:52px;margin-top:16px;padding:0 24px;font-size:17px;font-weight:700;color:var(--paper);background:var(--ink);border:2px solid var(--ink);border-radius:4px;cursor:pointer}
.err{min-height:1.6em;margin:8px 0 0;font-size:15px;font-weight:500;color:#7A3200}
.agenda{padding:32px 0;display:flex;flex-direction:column;gap:12px}
.agenda label{font-size:15px;font-weight:700}
.agenda input,.agenda textarea{width:100%;padding:14px 16px;font-size:18px;font-family:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:4px}
.agenda input{min-height:56px}
.agenda textarea{min-height:420px;font-size:17px;line-height:1.9;resize:vertical}
.hint{margin:0;font-size:14px;color:var(--muted)}
.msg{margin:0;font-size:15px;line-height:1.7;color:#7A3200}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
[hidden]{display:none!important}
h1{margin:0;font-family:'Noto Serif TC','Songti TC',serif;font-weight:700;font-size:clamp(34px,6vw,60px);line-height:1.15;letter-spacing:.02em}
.intro{margin:0;font-size:18px;line-height:1.7;max-width:36em;color:#3A4050;text-wrap:pretty}
.tools{padding:32px 0 8px;display:flex;flex-direction:column;gap:20px}
.tools label.q{font-size:15px;font-weight:700;display:block;margin-bottom:8px}
#q{width:100%;min-height:56px;padding:0 18px;font-size:18px;font-family:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:4px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row .tag{font-size:15px;font-weight:700;width:3em}
.chip{min-height:44px;padding:0 18px;font-size:16px;font-weight:500;cursor:pointer;border:2px solid var(--ink);background:transparent;color:var(--ink)}
.chip.pill{border-radius:999px}.chip.sq{border-radius:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.count{font-size:15px;color:var(--muted)}
main{margin-top:8px;border-bottom:1px solid var(--line)}
article{border-top:1px solid var(--line);padding:28px 0 20px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.id{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.badge{font-size:14px;font-weight:700;padding:3px 12px;border-radius:4px}
.cat{font-size:14px;font-weight:500;padding:1px 10px;border-radius:4px;border:1px solid var(--ink)}
h2{margin:0;font-family:'Noto Serif TC','Songti TC',serif;font-weight:600;font-size:26px;line-height:1.4}
h2 button{display:block;width:100%;padding:0;margin:0;text-align:left;background:transparent;border:0;cursor:pointer;font:inherit;color:inherit;text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:4px 24px;font-size:16px;color:#3A4050}
.bar{display:flex;gap:4px}.bar i{flex:1 1 0;height:8px;border-radius:2px}
.cur{font-size:16px;font-weight:700;margin-top:8px}
.more{min-height:44px;padding:0;background:transparent;border:0;cursor:pointer;font-size:16px;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:4px;text-align:left}
.detail{margin-top:4px;padding:24px;background:#fff;border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;gap:24px}
.detail p{margin:0;font-size:15px;line-height:1.75;text-wrap:pretty;white-space:pre-line}
dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px 24px}
dt{font-size:14px;color:var(--muted)}dd{margin:4px 0 0;font-size:17px;font-weight:500}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(110px,100%),1fr));gap:16px 12px}
.step{display:flex;flex-direction:column;gap:6px}.step i{height:6px;border-radius:2px}
.step b{font-size:16px}.step .t{font-size:14px;font-weight:500}.step .d{font-size:14px;color:var(--muted)}
.files{list-style:none;margin:0;padding:0}.files li{border-bottom:1px solid var(--line)}.files a{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;font-weight:500;color:var(--accent);text-underline-offset:4px;word-break:break-all}
.note{padding:16px 18px;background:var(--paper);border-radius:4px;font-size:16px;line-height:1.7}
.empty{border-top:1px solid var(--line);padding:56px 0;text-align:center;font-size:18px;line-height:1.7;color:#3A4050}
footer{padding-top:32px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.7;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="viewPublic">
  <header>
    <div class="topbar">
      <div class="school">國立臺北大學三峽校區學生議會</div>
      <button type="button" class="secbtn" id="goSec"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>秘書處</button>
    </div>
    <h1>議案查詢</h1>
    <p class="intro">法案是學生議員或各級機關的提案。如果法案通過三峽校區學生議會和跨校區法案所必需的所有審查程序，並獲得公布，即可正式生效。</p>
  </header>

  <section class="tools" aria-label="搜尋與篩選">
    <div>
      <label class="q" for="q">搜尋議案</label>
      <input id="q" type="search" placeholder="例如：修正案、林某某、27-007" autocomplete="off">
    </div>
    <div class="row" role="group" aria-label="依分類篩選"><span class="tag">分類</span><span id="cats" class="row"></span></div>
    <div class="row" role="group" aria-label="依狀態篩選"><span class="tag">狀態</span><span id="stats" class="row"></span></div>
    <div class="count" id="count" aria-live="polite"></div>
  </section>

  <main id="list"></main>

  <footer>
    <div id="updated"></div>
    <div>對議案內容有疑問，請洽議事組：[聯絡信箱或社群帳號]</div>
  </footer>
</div>

<!-- 秘書處登入 -->
<div class="wrap" id="viewLogin" hidden>
  <header>
    <div class="topbar">
      <div class="school">國立臺北大學三峽校區學生議會</div>
      <button type="button" class="secbtn" id="loginBack">返回議案查詢</button>
    </div>
    <h1>秘書處登入</h1>
    <p class="intro">此區僅供學生議會秘書處使用。</p>
  </header>
  <form class="form" id="loginForm" autocomplete="off">
    <label for="u">帳號</label>
    <input id="u" name="u" type="text" autocapitalize="none" autocomplete="off" required>
    <label for="pw">密碼</label>
    <input id="pw" name="pw" type="password" autocomplete="off" required>
    <p class="err" id="loginErr" role="alert"></p>
    <button type="submit" class="primary">登入</button>
  </form>
</div>

<!-- 秘書處：議程草擬系統 -->
<div class="wrap" id="viewSec" hidden>
  <header>
    <div class="topbar">
      <div class="school">國立臺北大學三峽校區學生議會　秘書處</div>
      <div class="topbtns">
        <button type="button" class="secbtn" id="secHome">議案查詢</button>
        <button type="button" class="secbtn" id="logout">登出</button>
      </div>
    </div>
    <h1>議程草擬系統</h1>
    <p class="intro">輸入要討論的議案編號，自動產生議程草稿。</p>
  </header>
  <section class="agenda" aria-label="議程草擬">
    <label for="agIds">議案編號</label>
    <input id="agIds" type="text" placeholder="例如：27-001、27-002、27-003" autocomplete="off">
    <p class="hint">用頓號、逗號或空格分開，議程會依輸入的順序排列。</p>
    <div class="btnrow"><button type="button" class="primary" id="agMake" style="margin-top:4px">產生議程</button></div>
    <p class="msg" id="agMsg" role="status"></p>
    <label for="agOut">議程草稿（可直接修改）</label>
    <textarea id="agOut" spellcheck="false"></textarea>
    <div class="btnrow">
      <button type="button" class="secbtn" id="agCopy">複製議程</button>
      <button type="button" class="secbtn" id="agDown">下載文字檔</button>
    </div>
  </section>
</div>

<script>
/* ★ 唯一需要設定的地方：貼上「發布到網路」的 CSV 網址
   取得方式：試算表 → 檔案 → 分享 → 發布到網路 → 選「議案」工作表與「逗號分隔值 (.csv)」→ 發布 */
const SHEET_API_URL = '';  // ★ 貼上 Apps Script「網頁應用程式網址」（結尾 /exec），優先使用
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTpmcb-SNX4oNyKistKmsGQVmQrddPFijU-XKJ6vL7bF_Po11pqG_6cJzDPbYkCfGR7RjdPTgOjkID8/pub?gid=1254595337&single=true&output=csv';

// 欄位別名：試算表表頭只要符合其中一個名稱就能讀到（可自行增加）
const ALIASES = {
  id: ['編號', '議案編號', '案號', '提案編號', '議案號碼', 'ID', 'id'],
  title: ['標題', '議案名稱', '案名', '提案名稱', '名稱'],
  cat: ['分類', '類別', '議案類別', '案別'],
  name: ['提案人姓名', '姓名', '提案人', '提案者'],
  ptitle: ['提案人職稱', '職稱', '提案人單位'],
  unit: ['提案單位', '所屬單位', '單位', '提案機關'],
  date: ['提案日期', '日期', '提案時間'],
  committee: ['審查單位', '審查委員會', '委員會', '交付委員會'],
  summary: ['摘要', '內容', '說明', '提案說明'],
  stage: ['目前關卡', '目前進度', '審查進度', '進度', '目前審查階段', '審查階段'],
  status: ['狀態', '議案狀態', '審查結果', '結果'],
  note: ['最新說明', '備註', '最新進度說明']
};
const MAX_FILES = 5; // 附件欄位：附件1 ~ 附件5，儲存格寫「顯示名稱 | 網址」或直接貼網址

const CATS = ['一般提案','法律案','財務案','人事案','報告案','備查案'];

const STAGES = ['提案送出','形式審查','一讀','委員會審查','二讀','送出本會','公告'];
const STATUS = {
  '審查中':{bg:'#E3ECF9',fg:'#17407F'},
  '已通過':{bg:'#1D2230',fg:'#F7F4EC'},
  '已退回':{bg:'#FBE6D0',fg:'#7A3200'},
  '已撤案':{bg:'#E7E5DE',fg:'#4A4F5C'}
};
const ACCENT = '#1F4E9A', INK = '#1D2230';

const S = { bills: [], q: '', cat: '全部', status: '全部', open: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function parseFiles(head, r) {
  const out = [];
  for (let n = 1; n <= MAX_FILES; n++) {
    const i = head.indexOf('附件' + n);
    if (i === -1) continue;
    const raw = (r[i] || '').trim();
    if (!raw) continue;
    const parts = raw.split(/[|｜]/).map((x) => x.trim());
    const url = parts.length > 1 ? parts[parts.length - 1] : parts[0];
    if (!/^https?:\/\//i.test(url)) continue; // 只接受 http(s) 連結
    out.push({ name: parts.length > 1 && parts[0] ? parts[0] : '附件' + n, url: url });
  }
  return out;
}

function toBills(rows) {
  const head = rows[0].map((h) => h.replace(/^﻿/, '').trim());
  const col = {};
  Object.keys(ALIASES).forEach((k) => {
    col[k] = head.findIndex((h) => ALIASES[k].indexOf(h) !== -1);
  });
  if (col.title === -1) {
    const e = new Error('找不到「標題」欄。目前讀到的表頭：' + (head.filter(Boolean).join('、') || '（空白）'));
    e.headers = head; throw e;
  }
  S.noIdCol = col.id === -1;
  const get = (r, k) => (col[k] === -1 ? '' : (r[col[k]] || '').trim());
  return rows.slice(1).filter((r) => r.some((c) => c.trim())).map((r, n) => {
    const pname = get(r, 'name'), ptitle = get(r, 'ptitle');
    const stageText = get(r, 'stage');
    let stage = STAGES.indexOf(stageText);
    if (stage === -1) stage = 0;
    const statusText = get(r, 'status');
    return {
      id: get(r, 'id') || String(n + 1), title: get(r, 'title'),
      cat: CATS.indexOf(get(r, 'cat')) !== -1 ? get(r, 'cat') : '一般提案',
      proposer: pname, ptitle: ptitle, proposerFull: pname + (ptitle ? '（' + ptitle + '）' : '') + (get(r, 'unit') ? '（' + get(r, 'unit') + '）' : ''),
      unit: get(r, 'unit'), date: get(r, 'date'), committee: get(r, 'committee'),
      summary: get(r, 'summary'), note: get(r, 'note'),
      files: parseFiles(head, r),
      stage: stage, status: STATUS[statusText] ? statusText : '審查中',
    };
  });
}

// 顯示規則：這些分類的下列關卡不適用（只影響網頁顯示，不影響試算表格式）
const NA_STAGES = ['委員會審查','二讀','送出本會','公告'];
const NA_CATS = ['報告案','備查案','一般提案','人事案'];
const isNA = (b, label) => NA_CATS.indexOf(b.cat) !== -1 && NA_STAGES.indexOf(label) !== -1;
const shadow = (s) => (s.na ? ';box-shadow:inset 0 0 0 1px #A9A395' : '');

function steps(b) {
  return STAGES.map((label, i) => {
    if (isNA(b, label)) return { label: label, bar: 'transparent', tag: '不適用', tc: '#5A6070', lc: '#5A6070', na: true };
    let st;
    if (b.status === '已通過' || i < b.stage) st = 'done';
    else if (i === b.stage) st = b.status === '審查中' ? 'current' : (b.status === '已退回' ? 'returned' : 'withdrawn');
    else st = 'pending';
    const m = {
      done:{bar:INK,tag:'已完成',tc:'#3A4050',lc:INK},
      current:{bar:ACCENT,tag:'進行中',tc:ACCENT,lc:INK},
      returned:{bar:'#C2570C',tag:'於此退回',tc:'#7A3200',lc:INK},
      withdrawn:{bar:'#8A8F9C',tag:'於此撤案',tc:'#4A4F5C',lc:INK},
      pending:{bar:'#D9D3C4',tag:'尚未進行',tc:'#5A6070',lc:'#5A6070'}
    }[st];
    return Object.assign({ label: label }, m);
  });
}

function currentLabel(b) {
  if (b.status === '已通過') {
    if (b.cat === '報告案') return '已洽悉';
    if (b.cat === '備查案') return '准予備查';
    return isNA(b, '公告') ? '已通過' : '已通過，並已公告';
  }
  if (b.status === '已退回') return '在「' + STAGES[b.stage] + '」被退回';
  if (b.status === '已撤案') return '在「' + STAGES[b.stage] + '」撤案';
  return STAGES[b.stage];
}

function chips(el, names, current, cls, key) {
  el.innerHTML = names.map((n) => {
    const c = n === '全部' ? S.bills.length : S.bills.filter((b) => (key === 'cat' ? b.cat : b.status) === n).length;
    return '<button type="button" class="chip ' + cls + '" data-' + key + '="' + esc(n) + '" aria-pressed="' + (n === current) + '">' + esc(n) + '（' + c + '）</button>';
  }).join('');
}

function render() {
  chips($('cats'), ['全部'].concat(CATS), S.cat, 'sq', 'cat');
  chips($('stats'), ['全部'].concat(Object.keys(STATUS)), S.status, 'pill', 'status');

  const q = S.q.trim().toLowerCase();
  const list = S.bills.filter((b) =>
    (S.cat === '全部' || b.cat === S.cat) &&
    (S.status === '全部' || b.status === S.status) &&
    (!q || (b.title + b.proposerFull + b.unit + b.id + b.committee).toLowerCase().indexOf(q) !== -1));

  $('count').textContent = '共 ' + list.length + ' 件議案';
  $('list').innerHTML = list.length ? list.map((b) => {
    const st = STATUS[b.status], sp = steps(b), open = S.open === b.id;
    return '<article>' +
      '<div class="head"><span class="id">議案 ' + esc(b.id) + '</span>' +
      '<span class="badge" style="background:' + st.bg + ';color:' + st.fg + '">' + esc(b.status) + '</span>' +
      '<span class="cat">' + esc(b.cat) + '</span></div>' +
      '<h2><button type="button" data-open="' + esc(b.id) + '" aria-expanded="' + open + '">' + esc(b.title) + '</button></h2>' +
      '<div class="meta"><span>提案人：<strong>' + esc(b.proposer) + '</strong>' + (b.ptitle ? '（' + esc(b.ptitle) + '）' : '') + (b.unit ? '（' + esc(b.unit) + '）' : '') + '</span><span>' + esc(b.date) + ' 提案</span></div>' +
      '<div><div class="bar" role="img" aria-label="共 ' + STAGES.length + ' 關，目前：' + esc(currentLabel(b)) + '">' +
        sp.map((s) => '<i style="background:' + s.bar + shadow(s) + '"></i>').join('') + '</div>' +
      '<div class="cur">目前進度：' + esc(currentLabel(b)) + '</div></div>' +
      '<div><button type="button" class="more" data-open="' + esc(b.id) + '" aria-expanded="' + open + '">' + (open ? '收合詳情' : '查看詳情') + '</button></div>' +
      (open ? '<div class="detail">' +
        (b.summary ? '<p>' + esc(b.summary) + '</p>' : '') +
        '<dl><div><dt>提案人</dt><dd>' + esc(b.proposerFull) + '</dd></div>' +
        '<div><dt>審查單位</dt><dd>' + esc(b.committee) + '</dd></div></dl>' +
        (b.files.length ? '<div><div style="font-size:15px;font-weight:700;margin-bottom:4px">附件</div><ul class="files">' +
          b.files.map((f) => '<li><a href="' + esc(f.url) + '" target="_blank" rel="noopener noreferrer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>' + esc(f.name) + '</a></li>').join('') +
        '</ul></div>' : '') +
        '<div><div style="font-size:15px;font-weight:700;margin-bottom:12px">審查歷程</div><div class="steps">' +
          sp.map((s) => '<div class="step"><i style="background:' + s.bar + shadow(s) + '"></i><b style="color:' + s.lc + '">' + s.label + '</b><span class="t" style="color:' + s.tc + '">' + s.tag + '</span></div>').join('') +
        '</div></div>' +
        (b.note ? '<div class="note"><strong>最新說明：</strong>' + esc(b.note) + '</div>' : '') +
      '</div>' : '') +
      '</article>';
  }).join('') : '<div class="empty">找不到符合的議案。<br>換個關鍵字，或把篩選改回「全部」試試。</div>';
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.cat) S.cat = t.dataset.cat;
  else if (t.dataset.status) S.status = t.dataset.status;
  else if (t.dataset.open) S.open = S.open === t.dataset.open ? null : t.dataset.open;
  else return;
  render();
});
$('q').addEventListener('input', (e) => { S.q = e.target.value; render(); });

async function load() {
  if (!SHEET_API_URL && !SHEET_CSV_URL) {
    $('list').innerHTML = '<div class="empty">尚未設定資料來源。<br>請在 index.html 的 SHEET_CSV_URL 貼上試算表的 CSV 網址。</div>';
    return;
  }
  $('list').innerHTML = '<div class="empty">載入議案中…</div>';
  try {
    let rows;
    if (SHEET_API_URL) {
      const res = await fetch(SHEET_API_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      rows = (await res.json()).values;
    } else {
      const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      rows = parseCSV(await res.text());
    }
    if (!rows || !rows.length) throw new Error('試算表沒有資料');
    S.bills = toBills(rows).reverse();
    $('updated').textContent = '資料載入時間：' + new Date().toLocaleString('zh-TW', { hour12: false });
    render();
  } catch (err) {
    const why = err && err.headers ? err.message : '無法連到試算表（' + (err && err.message ? err.message : '未知原因') + '）。請確認已「發布到網路」且格式為 CSV。';
    S.err = why;
    $('list').innerHTML = '<div class="empty">暫時讀不到議案資料。<br><span style="font-size:15px;color:#5A6070">' + esc(why) + '</span></div>';
    console.error(err);
  }
}
/* ====== 秘書處 ====== */
// 帳號密碼只以雜湊值存放，原始碼裡看不到明文；這只是簡易的前台門檻，不是真正的資安防護。
const AUTH_SALT = 'ntpu-sps-secretariat-v1|';
const AUTH_USER = '9c2a82e661079c994c098f80a8a6023938f56a361d9f8f208b884fc421b52d51';
const AUTH_PASS = '88f1bd440bd2932e7d41a1fdc482dbe6252e86aa31f32dec2c10f773bb7132c9';

function sha256(msg){
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  const bytes=[...unescape(encodeURIComponent(msg))].map(c=>c.charCodeAt(0));
  const K=[],H=[];let n=2,cnt=0;
  const frac=(x)=>Math.floor((x-Math.floor(x))*4294967296);
  for(;cnt<64;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break;}
    if(p){if(cnt<8)H[cnt]=frac(Math.pow(n,1/2));K[cnt]=frac(Math.pow(n,1/3));cnt++;}}
  const l=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  for(let i=7;i>=0;i--)bytes.push(i>=4?0:(l>>>(i*8))&255);
  for(let off=0;off<bytes.length;off+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++)w[i]=(bytes[off+4*i]<<24)|(bytes[off+4*i+1]<<16)|(bytes[off+4*i+2]<<8)|bytes[off+4*i+3];
    for(let i=16;i<64;i++){const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K[i]+w[i])|0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);const mj=(a&b)^(a&c)^(b&c);const t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}


const views = { pub: $('viewPublic'), login: $('viewLogin'), sec: $('viewSec') };
function show(name) {

const isAuthed = () => { try { return sessionStorage.getItem('sec') === '1'; } catch (e) { return false; } };

});

/* ====== 議程草擬 ====== */
const CN = '零一二三四五六七八九';
function cn(n) {
  if (n < 10) return CN[n];
  if (n < 20) return '十' + (n % 10 ? CN[n % 10] : '');
  if (n < 100) return CN[Math.floor(n / 10)] + '十' + (n % 10 ? CN[n % 10] : '');
  return String(n);
}
// 編號比對：全形轉半形、忽略空白與大小寫、數字前面的 0 不影響（27-1 與 27-001 視為相同），可省略前綴
const normId = (x) => String(x == null ? '' : x).normalize('NFKC').replace(/[–—−﹣－]/g, '-').replace(/\s+/g, '').toUpperCase()
  .split('-').map((p) => (/^\d+$/.test(p) ? String(parseInt(p, 10)) : p)).join('-');

function makeAgenda() {
  const msg = $('agMsg'); msg.textContent = '';
  const raw = $('agIds').value.split(/[、,，;；\s]+/).map((x) => x.trim()).filter(Boolean);
  if (!raw.length) { msg.textContent = '請先輸入至少一個議案編號。'; return; }
  if (!S.bills.length) { msg.textContent = S.err ? ('議案資料讀取失敗：' + S.err) : '議案資料還沒載入完成，請稍候再試一次。'; return; }
  if (S.noIdCol) { msg.textContent = '試算表裡找不到「編號」欄（表頭請寫「編號」），所以無法依編號查詢。'; return; }
  const seen = {}, found = [], missing = [], dup = [];
  raw.forEach((orig) => {
    const key = normId(orig);
    if (seen[key]) { dup.push(orig); return; }
    seen[key] = true;
    // 先找完全相同的編號；找不到時，允許省略前綴（例如只打 27-001 也能對到 NTPUSP-27-001）
    const b = S.bills.find((x) => normId(x.id) === key) || S.bills.find((x) => normId(x.id).endsWith('-' + key));
    b ? found.push(b) : missing.push(orig);
  });
  const lines = ['【議程】', '一、開會', '二、主席致詞', '三、確認議程', '四、報告事項', '五、答問時段', '六、討論事項']
    .concat(found.map((b, i) => '　（' + cn(i + 1) + '）審查【' + b.title + '】'))
    .concat(['七、會務質詢', '八、臨時動議', '九、散會']);
  $('agOut').value = lines.join('\n');
  const notes = [];
  if (missing.length) {
    const sample = S.bills.slice(0, 5).map((b) => b.id).join('、');
    notes.push('找不到這些編號，已略過：' + missing.join('、') + '。目前讀到 ' + S.bills.length + ' 筆議案，編號例如：' + sample + '。');
  }
  if (dup.length) notes.push('重複輸入的編號只列一次：' + dup.join('、') + '。');
  msg.textContent = notes.join('');
}
$('agMake').addEventListener('click', makeAgenda);
$('agIds').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); makeAgenda(); } });
$('agCopy').addEventListener('click', async () => {
  const t = $('agOut').value; if (!t) return;
  try { await navigator.clipboard.writeText(t); }
  catch (err) { $('agOut').select(); document.execCommand('copy'); }
  $('agMsg').textContent = '已複製議程。';
});
$('agDown').addEventListener('click', () => {
  const t = $('agOut').value; if (!t) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: 'text/plain;charset=utf-8' }));
  a.download = '議程.txt'; a.click(); URL.revokeObjectURL(a.href);
});

load();
